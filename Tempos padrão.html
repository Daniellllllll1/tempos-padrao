<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempos padrão</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#dedcd5;--ac:#b4472b;--acx:#fff;--ok:#2f7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#eeede8;--mut:#9a998f;--bd:#3a3a36;--ac:#e0704f;--acx:#1a1a18;--ok:#5fc08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#eeede8;--mut:#9a998f;--bd:#3a3a36;--ac:#e0704f;--acx:#1a1a18;--ok:#5fc08a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;min-width:0}
input[type=text],input:not([type]){flex:1 1 140px}
.num{width:90px;flex:0 0 90px!important;text-align:right}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.x{color:var(--ac)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td input,td select{width:100%}
.mut{color:var(--mut);font-size:13px}
.tot{font-size:18px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.kpi{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.kpi div span{display:block;font-size:12px;color:var(--mut)}
textarea{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace}
.use{color:var(--ok)}
.mat{min-width:0;width:auto}
.mat th.sticky{position:sticky;left:0;background:var(--card);text-align:left;text-transform:none;font-size:14px;color:var(--tx);font-weight:600;min-width:160px;z-index:1}
.mat th.sticky small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.mat th.mh{text-align:center;min-width:90px;white-space:normal;text-transform:none;font-size:13px;color:var(--tx)}
.mat td{text-align:center;min-width:90px;border-left:1px solid var(--bd)}
.mat td.hit{background:color-mix(in srgb,var(--ac) 16%,transparent);font-weight:600}
.mat tr.sum td,.mat tr.sum th{border-top:2px solid var(--tx);font-weight:700}
</style></head><body><main>
<h1>Tempos padrão</h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
const KEY="tempos-padrao-v2";
let D={ops:[],modelos:[]},S={tab:"ops",m:null,q:""};
try{const r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const fm=s=>s==null?"–":Number(s).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fs=fm;
const op=id=>D.ops.find(o=>o.id===id);
const eff=l=>{const o=op(l.op);const s=(l.seg!=null&&l.seg!=="")?l.seg:(o?o.seg:0);return s};
const sub=l=>eff(l)*(l.qtd||1);
const total=m=>m.linhas.reduce((a,l)=>a+sub(l),0);
const cur=()=>D.modelos.find(m=>m.id===S.m)||D.modelos[0];
const uses=id=>D.modelos.filter(m=>m.linhas.some(l=>l.op===id)).length;

const TABS=[["ops","Operações"],["mod","Modelos"],["mat","Comparar modelos"],["bkp","Backup"]];
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?"on":""}" data-act="tab" data-k="${k}">${n}</button>`).join("");
  const v=document.getElementById("view");
  v.innerHTML=S.tab==="ops"?opsView():S.tab==="mod"?modView():S.tab==="mat"?matView():bkpView();
}
function opsView(){
  return `<div class="card"><h2>Nova operação</h2><div class="row">
  <input id="n-nome" placeholder="Nome (ex.: Colar etiqueta)"><input id="n-grupo" placeholder="Setor / máquina">
  <input id="n-seg" class="num" inputmode="decimal" placeholder="Tempo (min) ex.: 2,88"><button class="pri" data-act="addop">Adicionar</button></div>
  <p class="mut" style="margin:8px 0 0">O tempo é lançado uma vez aqui e vale para todos os modelos que usam a operação.</p></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Biblioteca (${D.ops.length})</h2>
  <input id="q" placeholder="Buscar operação ou setor" value="${esc(S.q)}" style="max-width:260px"></div><div class="scroll" id="oplist">${opsTable()}</div></div>`;
}
function opsTable(){
  const q=S.q.toLowerCase();
  const L=D.ops.filter(o=>(o.nome+" "+o.grupo).toLowerCase().includes(q));
  if(!L.length)return `<p class="mut">${D.ops.length?"Nada encontrado.":"Nenhuma operação ainda. Adicione a primeira acima."}</p>`;
  return `<table><tr><th>Operação</th><th>Setor / máquina</th><th class="r">Tempo (min)</th><th class="r">Modelos</th><th></th></tr>`+
  L.map(o=>`<tr><td><input data-f="op" data-k="nome" data-id="${o.id}" value="${esc(o.nome)}"></td>
  <td><input data-f="op" data-k="grupo" data-id="${o.id}" value="${esc(o.grupo)}"></td>
  <td class="r"><input class="num" inputmode="decimal" data-f="op" data-k="seg" data-id="${o.id}" value="${fm(o.seg)}"></td>
  <td class="r use">${uses(o.id)}</td>
  <td><button class="x" data-act="delop" data-id="${o.id}">Excluir</button></td></tr>`).join("")+`</table>`;
}
function modView(){
  const chips=D.modelos.map(m=>`<button class="${m===cur()?"on":""}" data-act="selm" data-id="${m.id}">${esc(m.nome)}</button>`).join("");
  const head=`<div class="card"><div class="row"><input id="n-mod" placeholder="Nome do novo modelo"><button class="pri" data-act="addmod">Criar modelo</button></div></div>`;
  const m=cur();
  if(!m)return head+`<p class="mut">Crie o primeiro modelo para montar o roteiro de operações.</p>`;
  const opts=D.ops.map(o=>`<option value="${o.id}">${esc(o.nome)}${o.grupo?" · "+esc(o.grupo):""}</option>`).join("");
  const rows=m.linhas.map((l,i)=>{const o=op(l.op);return `<tr>
  <td>${i+1}</td><td><select data-f="line" data-k="op" data-i="${i}">${D.ops.map(x=>`<option value="${x.id}" ${x.id===l.op?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></td>
  <td class="r"><input class="num" inputmode="numeric" data-f="line" data-k="qtd" data-i="${i}" value="${l.qtd||1}"></td>
  <td class="r"><input class="num" inputmode="decimal" data-f="line" data-k="seg" data-i="${i}" value="${l.seg==null?"":fm(l.seg)}" placeholder="${o?fm(o.seg):""}"></td>
  <td class="r">${fs(sub(l))}</td><td><button class="x" data-act="delline" data-i="${i}">Tirar</button></td></tr>`}).join("");
  const t=total(m);
  return head+`<div class="chips">${chips}</div><div class="card">
  <div class="row" style="margin-bottom:10px"><input data-f="mnome" value="${esc(m.nome)}" style="font-weight:600">
  <button data-act="dupmod">Duplicar</button><button class="x" data-act="delmod">Excluir modelo</button></div>
  <div class="scroll"><table><tr><th>#</th><th>Operação</th><th class="r">Qtd</th><th class="r">Tempo próprio (min)</th><th class="r">Subtotal (min)</th><th></th></tr>${rows||`<tr><td colspan="6" class="mut">Sem operações neste modelo.</td></tr>`}</table></div>
  ${D.ops.length?`<div class="row" style="margin-top:10px"><select id="add-op" style="flex:1 1 200px">${opts}</select><button class="pri" data-act="addline">Adicionar ao modelo</button></div>`:`<p class="mut">Cadastre operações na aba Operações primeiro.</p>`}
  <p class="mut" style="margin:8px 0 0">“Tempo próprio” é opcional: deixe vazio para usar o tempo padrão da operação.</p>
  <div class="kpi"><div><span>Tempo total (min)</span><b class="tot">${fm(t)}</b></div><div><span>Peças por hora</span><b class="tot">${t?fm(60/t):"–"}</b></div></div></div>`;
}
function matView(){
  const ms=D.modelos,os=D.ops.filter(o=>uses(o.id)>0);
  if(!ms.length||!os.length)return `<p class="mut">Esta aba aparece quando houver modelos com operações no roteiro.</p>`;
  const head=ms.map(m=>`<th class="mh">${esc(m.nome)}</th>`).join("");
  const rows=os.map(o=>`<tr><th class="sticky">${esc(o.nome)}${o.grupo?`<small>${esc(o.grupo)}</small>`:""}</th>`+ms.map(m=>{const ls=m.linhas.filter(l=>l.op===o.id);return ls.length?`<td class="hit">${fm(ls.reduce((a,l)=>a+sub(l),0))}</td>`:`<td></td>`}).join("")+`</tr>`).join("");
  const tot=`<tr class="sum"><th class="sticky">Tempo total (min)</th>`+ms.map(m=>`<td>${fm(total(m))}</td>`).join("")+`</tr>`;
  const ph=`<tr><th class="sticky">Peças por hora</th>`+ms.map(m=>`<td>${total(m)?fm(60/total(m)):"–"}</td>`).join("")+`</tr>`;
  return `<div class="card"><h2>Quais operações cada modelo usa</h2><p class="mut">Cada coluna é um modelo. Célula colorida = o modelo usa a operação, e o número é o tempo em minutos. Célula vazia = não usa.</p><div class="scroll"><table class="mat"><tr><th class="sticky">Operação</th>${head}</tr>${rows}${tot}${ph}</table></div></div>`;
}
function matViewOld(){
  if(!D.ops.length||!D.modelos.length)return `<p class="mut">A matriz aparece quando houver operações e modelos.</p>`;
  const th=D.modelos.map(m=>`<th class="r">${esc(m.nome)}</th>`).join("");
  const rows=D.ops.map(o=>`<tr><td>${esc(o.nome)}<div class="mut">${esc(o.grupo)}</div></td><td class="r">${fs(o.seg)}</td>`+
  D.modelos.map(m=>{const ls=m.linhas.filter(l=>l.op===o.id);return `<td class="r">${ls.length?fs(ls.reduce((a,l)=>a+sub(l),0)):`<span class="mut">·</span>`}</td>`}).join("")+`</tr>`).join("");
  const tr=`<tr><td><b>Total (s)</b></td><td></td>`+D.modelos.map(m=>`<td class="r"><b>${fs(total(m))}</b></td>`).join("")+`</tr>`;
  const tm=`<tr><td><b>Total (min)</b></td><td></td>`+D.modelos.map(m=>`<td class="r">${fm(total(m))}</td>`).join("")+`</tr>`;
  return `<div class="card"><h2>Operações × modelos (segundos)</h2><div class="scroll"><table style="min-width:${300+D.modelos.length*110}px"><tr><th>Operação</th><th class="r">Padrão</th>${th}</tr>${rows}${tr}${tm}</table></div></div>`;
}
function bkpView(){
  return `<div class="card"><h2>Backup</h2><p class="mut">Os dados ficam salvos neste navegador. Para levar a outro computador ou guardar uma cópia, copie o texto abaixo.</p>
  <textarea id="bk" readonly>${esc(JSON.stringify(D))}</textarea><div class="row" style="margin-top:8px"><button data-act="copy">Copiar</button><span class="mut" id="bk-msg"></span></div></div>
  <div class="card"><h2>Restaurar</h2><p class="mut">Cole aqui um backup. Isso substitui os dados atuais.</p><textarea id="rs" placeholder="Cole o backup aqui"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" data-act="restore">Restaurar</button><span class="mut" id="rs-msg"></span></div></div>`;
}
const armed=new WeakSet();
function arm(b){if(armed.has(b))return true;armed.add(b);const t=b.textContent;b.textContent="Confirmar?";setTimeout(()=>{armed.delete(b);b.textContent=t},3000);return false}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="tab"){S.tab=b.dataset.k;render()}
  else if(a==="addop"){const nome=document.getElementById("n-nome").value.trim(),seg=num(document.getElementById("n-seg").value);
    if(!nome||seg==null){document.getElementById("n-nome").focus();return}
    D.ops.push({id:uid(),nome,grupo:document.getElementById("n-grupo").value.trim(),seg});save();render()}
  else if(a==="delop"){if(!arm(b))return;const id=b.dataset.id;D.ops=D.ops.filter(o=>o.id!==id);D.modelos.forEach(m=>m.linhas=m.linhas.filter(l=>l.op!==id));save();render()}
  else if(a==="addmod"){const n=document.getElementById("n-mod").value.trim();if(!n)return;const m={id:uid(),nome:n,linhas:[]};D.modelos.push(m);S.m=m.id;save();render()}
  else if(a==="selm"){S.m=b.dataset.id;render()}
  else if(a==="dupmod"){const m=cur();if(!m)return;const c=JSON.parse(JSON.stringify(m));c.id=uid();c.nome=m.nome+" (cópia)";D.modelos.push(c);S.m=c.id;save();render()}
  else if(a==="delmod"){if(!arm(b))return;D.modelos=D.modelos.filter(x=>x.id!==cur().id);S.m=null;save();render()}
  else if(a==="addline"){const m=cur(),id=document.getElementById("add-op").value;if(!m||!id)return;m.linhas.push({op:id,qtd:1,seg:null});save();render()}
  else if(a==="delline"){cur().linhas.splice(+b.dataset.i,1);save();render()}
  else if(a==="copy"){const t=document.getElementById("bk");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(x){}
    document.getElementById("bk-msg").textContent=ok?"Copiado.":"Selecionado: use Ctrl+C."}
  else if(a==="restore"){const msg=document.getElementById("rs-msg");try{const j=JSON.parse(document.getElementById("rs").value);
    if(!Array.isArray(j.ops)||!Array.isArray(j.modelos))throw 0;D=j;S.m=null;save();render()}catch(x){msg.textContent="Backup inválido."}}
});
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==="op"){const o=op(t.dataset.id);if(!o)return;if(t.dataset.k==="seg"){const n=num(t.value);if(n!=null)o.seg=n}else o[t.dataset.k]=t.value.trim()}
  else if(f==="mnome"){cur().nome=t.value.trim()||cur().nome}
  else if(f==="line"){const l=cur().linhas[+t.dataset.i],k=t.dataset.k;
    if(k==="op")l.op=t.value;else if(k==="qtd")l.qtd=Math.max(1,Math.round(num(t.value)||1));else l.seg=t.value.trim()===""?null:num(t.value)}
  save();render();
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;document.getElementById("oplist").innerHTML=opsTable()}
});
render();
</script></body></html>
